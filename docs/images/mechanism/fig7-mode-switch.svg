<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="模式切换：拨动开关三档对应蓝牙 1、蓝牙 2、2.4G，档位变化触发软复位，RAM 清空而保持寄存器和 Flash 保留">
<title>模式切换：拨动开关三档对应蓝牙 1、蓝牙 2、2.4G，档位变化触发软复位，RAM 清空而保持寄存器和 Flash 保留</title>
<style>
svg{--bg:#f2f4f8; --panel:#ffffff; --ink:#18212f; --muted:#566275; --line:#c3ccd9; --code-bg:#e7ebf2;
  --ble:#2257c5; --ble-bg:#e3ebfb; --g24:#0a7a67; --g24-bg:#def2ed; --usb:#a25a00; --usb-bg:#fbeedb;
  --slp:#5f45b5; --slp-bg:#ebe6fa; --slp2-bg:#d9d0f5; --rst:#b23030; --rst-bg:#fbe5e5;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
svg text{font-family:var(--sans);fill:var(--ink)}
.tt{font-size:13px;font-weight:700}
.ts{font-size:11.5px;fill:var(--muted)}
.tm{font-size:10.5px;font-family:var(--mono);fill:var(--muted)}
.td{font-size:12.5px;font-weight:700}
.ch{font-size:12px;font-weight:700;fill:var(--muted)}
.rl{font-size:14px;font-weight:700}
.lb,.rl{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.lb{font-size:11.5px}
.lt{font-size:11.5px;font-weight:700}
.lb.ble,.rl.ble,.lt.ble{fill:var(--ble)} .lb.g24,.rl.g24{fill:var(--g24)} .lb.usb,.rl.usb{fill:var(--usb)}
.lb.slp{fill:var(--slp)} .lb.rst,.rl.rst{fill:var(--rst)}
.nd{stroke-width:1.4}
.nd.n{fill:var(--panel);stroke:var(--ink)}
.nd.note{fill:var(--bg);stroke:var(--line);stroke-dasharray:5 4}
.nd.off{fill:var(--bg);stroke:var(--usb);stroke-dasharray:5 4}
.nd.ble{fill:var(--ble-bg);stroke:var(--ble)} .nd.g24{fill:var(--g24-bg);stroke:var(--g24)}
.nd.usb{fill:var(--usb-bg);stroke:var(--usb)} .nd.slp{fill:var(--slp-bg);stroke:var(--slp)}
.nd.slp2{fill:var(--slp2-bg);stroke:var(--slp);stroke-width:2.2} .nd.rst{fill:var(--rst-bg);stroke:var(--rst)}
.lane{fill:none;stroke-width:1.2;stroke-dasharray:6 4;stroke:var(--line)}
.lane.ble{stroke:var(--ble)}
.e{fill:none;stroke-width:1.5;stroke:var(--ink)}
.e.dash{stroke-dasharray:5 4}
.e.ble{stroke:var(--ble)} .e.g24{stroke:var(--g24)} .e.usb{stroke:var(--usb)} .e.slp{stroke:var(--slp)} .e.rst{stroke:var(--rst)}
.mk{fill:var(--ink)} .mk.ble{fill:var(--ble)} .mk.g24{fill:var(--g24)} .mk.usb{fill:var(--usb)} .mk.slp{fill:var(--slp)} .mk.rst{fill:var(--rst)}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="m7-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk ink" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
<marker id="m7-ble" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk ble" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
<marker id="m7-g24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk g24" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
<marker id="m7-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk usb" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
<marker id="m7-slp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk slp" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
<marker id="m7-rst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="mk rst" d="M0,0.8 L10,5 L0,9.2 z"/>
</marker>
</defs>
<text class="lb ink" x="30" y="28" text-anchor="start">MODE 引脚（P35）先下拉读一次，再上拉读一次</text>
<rect class="nd ble" x="30" y="40" width="220" height="58" rx="7"/>
<text class="tt" x="140.0" y="65.6" text-anchor="middle">引脚接地 → 蓝牙 1</text>
<text class="ts" x="140.0" y="82.3" text-anchor="middle">下拉读 0，上拉读 0</text>
<rect class="nd ble" x="30" y="112" width="220" height="58" rx="7"/>
<text class="tt" x="140.0" y="137.6" text-anchor="middle">引脚悬空 → 蓝牙 2</text>
<text class="ts" x="140.0" y="154.3" text-anchor="middle">下拉读 0，上拉读 1</text>
<rect class="nd g24" x="30" y="184" width="220" height="58" rx="7"/>
<text class="tt" x="140.0" y="209.6" text-anchor="middle">引脚接电源 → 2.4G</text>
<text class="ts" x="140.0" y="226.3" text-anchor="middle">下拉读 1，上拉读 1</text>
<polyline class="e ink" points="250,69 290,69 290,213 250,213"/>
<polyline class="e ink" points="250,141 330,141" marker-end="url(#m7-ink)"/>
<rect class="nd n" x="330" y="99" width="200" height="84" rx="7"/>
<text class="tt" x="430.0" y="129.6" text-anchor="middle">档位和当前模式不同？</text>
<text class="ts" x="430.0" y="146.3" text-anchor="middle">连续两次读到同一个新档位</text>
<text class="ts" x="430.0" y="162.3" text-anchor="middle">才算数</text>
<polyline class="e rst" points="530,141 590,141" marker-end="url(#m7-rst)"/>
<text class="lb rst" x="560" y="134" text-anchor="middle">是</text>
<rect class="nd rst" x="590" y="99" width="160" height="84" rx="7"/>
<text class="tt" x="670.0" y="137.6" text-anchor="middle">软复位</text>
<text class="tm" x="670.0" y="154.3" text-anchor="middle">NVIC_SystemReset()</text>
<polyline class="e rst" points="750,141 830,141" marker-end="url(#m7-rst)"/>
<rect class="nd n" x="830" y="99" width="150" height="84" rx="7"/>
<text class="tt" x="905.0" y="129.6" text-anchor="middle">main() 热启动</text>
<text class="ts" x="905.0" y="146.3" text-anchor="middle">按新档位进入模式</text>
<text class="ts" x="905.0" y="162.3" text-anchor="middle">自动回连</text>
<polyline class="e rst" points="630,183 630,240" marker-end="url(#m7-rst)"/>
<polyline class="e g24" points="710,183 710,240" marker-end="url(#m7-g24)"/>
<rect class="nd rst" x="330" y="240" width="320" height="100" rx="7"/>
<text class="tt" x="490.0" y="270.6" text-anchor="middle">复位时丢掉的</text>
<text class="ts" x="490.0" y="287.3" text-anchor="middle">RAM 里的全部变量</text>
<text class="ts" x="490.0" y="303.3" text-anchor="middle">当前的蓝牙连接 / 2.4G 同步</text>
<text class="ts" x="490.0" y="319.3" text-anchor="middle">灯效进度、还没发出去的按键</text>
<rect class="nd g24" x="670" y="240" width="310" height="100" rx="7"/>
<text class="tt" x="825.0" y="270.6" text-anchor="middle">复位后还在的</text>
<text class="ts" x="825.0" y="287.3" text-anchor="middle">保持寄存器：配对请求位、2.4G 同步字</text>
<text class="ts" x="825.0" y="303.3" text-anchor="middle">Flash：键表、灯效、休眠时间</text>
<text class="ts" x="825.0" y="319.3" text-anchor="middle">Flash：每个蓝牙通道的地址序号</text>
</svg>
